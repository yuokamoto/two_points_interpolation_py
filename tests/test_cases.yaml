# Performance comparison tests
performance_tests:
  - name: test_faster_deceleration_comparison
    description: "Test that faster deceleration reduces total time"
    test_type: comparison
    params_set:
      - name: "slower_deceleration"
        params:
          p0: 0.0
          pe: 30.0
          acc_max: 2.0
          dec_max: 2.0
          vmax: 10.0
          v0: 0.0
          ve: 0.0
        expected:
          case: 0
      - name: "faster_deceleration"
        params:
          p0: 0.0
          pe: 30.0
          acc_max: 2.0
          dec_max: 4.0
          vmax: 10.0
          v0: 0.0
          ve: 0.0
        expected:
          case: 0
    expected:
      comparison: "time[1] < time[0]"  # Faster deceleration should reduce time

  - name: test_default_dec_max_comparison
    description: "Test that dec_max defaults to acc_max when not specified"
    test_type: comparison
    params_set:
      - name: "without_dec_max"
        params:
          p0: 0.0
          pe: 20.0
          acc_max: 2.0
          vmax: 10.0
          v0: 0.0
          ve: 0.0
        expected:
          case: 0
      - name: "with_explicit_dec_max"
        params:
          p0: 0.0
          pe: 20.0
          acc_max: 2.0
          dec_max: 2.0
          vmax: 10.0
          v0: 0.0
          ve: 0.0
        expected:
          case: 0
    expected:
      comparison: "abs(time[0] - time[1]) < 0.001"  # Times and trajectories should be nearly identical

# Constraint validation tests
constraint_tests:
  - name: test_negative_acceleration
    description: "Test constraint validation for negative acceleration"
    test_type: constraint_validation
    params:
      acc_max: -1.0
      vmax: 2.0
      dec_max: 5.0
    expected:
      error: ValueError

  - name: test_negative_vmax
    description: "Test constraint validation for negative vmax"
    test_type: constraint_validation
    params:
      acc_max: 2.0
      vmax: -1.0
      dec_max: 5.0
    expected:
      error: ValueError

  - name: test_negative_deceleration
    description: "Test constraint validation for negative deceleration"
    test_type: constraint_validation
    params:
      acc_max: 2.0
      vmax: 2.0
      dec_max: -5.0
    expected:
      error: ValueError

  - name: test_zero_acceleration
    description: "Test constraint validation for zero acceleration"
    test_type: constraint_validation
    params:
      acc_max: 0.0
      vmax: 2.0
      dec_max: 5.0
    expected:
      error: ValueError

# Integration function tests
integration_tests:
  - name: test_v_integ
    description: "Test velocity integration function"
    test_type: utility
    function: v_integ
    params:
      v0: 10.0
      a: 2.0
      dt: 5.0
    expected:
      result: 20.0  # 10.0 + 2.0 * 5.0

  - name: test_p_integ
    description: "Test position integration function"
    test_type: utility
    function: p_integ
    params:
      p0: 0.0
      v0: 10.0
      a: 2.0
      dt: 5.0
    expected:
      result: 75.0  # 0.0 + 10.0 * 5.0 + 0.5 * 2.0 * 5.0^2

# Boundary condition tests
boundary_tests:
  - name: test_get_point_before_start
    description: "Test get_point at times before trajectory start"
    params:
      p0: 5.0
      pe: 15.0
      acc_max: 1.0
      vmax: 10.0
      dec_max: 1.0
      v0: 2.0
      ve: 1.0
    test_type: boundary
    test_time: 0.0  # At start
    expected:
      position: 5.0
      velocity: 2.0

  - name: test_get_point_after_end
    description: "Test get_point at times after trajectory end"
    params:
      p0: 5.0
      pe: 15.0
      acc_max: 1.0
      vmax: 10.0
      dec_max: 1.0
      v0: 2.0
      ve: 1.0
    test_type: boundary
    test_time: "end+1.0"  # 1 second after end
    expected:
      position: 15.0
      velocity: 1.0

# Overspeed condition tests
overspeed_tests:
  - name: test_forward_overspeed_warning
    description: "Forward overspeed: v0 > vmax"
    params:
      p0: 0.0
      pe: 5.0
      acc_max: 1.0
      vmax: 0.5
      dec_max: 1.0
      v0: 2.0
      ve: 0.0
    expected:
      case: 1
      warning: true
      warning_type: UserWarning
      warning_contains: "exceeds vmax"
      phase1_acceleration: -1.0  # Should decelerate
      p1: 1.875  # Intermediate position after deceleration (not 4.125)
    notes: |
      When v0 > vmax, Phase 1 should decelerate from v0 to vmax.
      dt01 = (0.5 - 2.0) / -1.0 = 1.5s
      p1 = 0 + 2.0*1.5 + 0.5*(-1.0)*(1.5^2) = 3.0 - 1.125 = 1.875m

  - name: test_backward_overspeed_warning
    description: "Backward overspeed: v0 < -vmax"
    params:
      p0: 10.0
      pe: 5.0
      acc_max: 1.0
      vmax: 0.5
      dec_max: 1.0
      v0: -2.0
      ve: 0.0
    expected:
      case: 1
      warning: true
      warning_type: UserWarning
      warning_contains: "exceeds vmax"
      phase1_acceleration: 1.0  # Should decelerate (positive in backward direction)
    notes: |
      When v0 < -vmax (backward overspeed), Phase 1 should decelerate
      by applying positive acceleration (slowing down backward motion).

  - name: test_no_warning_when_within_limit
    description: "Normal case: v0 within vmax"
    params:
      p0: 0.0
      pe: 5.0
      acc_max: 2.0
      vmax: 5.0
      dec_max: 2.0
      v0: 0.5
      ve: 0.0
    expected:
      case: 0  # High vmax means Case 0 (no cruise phase)
      warning: false
      phase1_acceleration: 2.0  # Should accelerate normally


# Initial velocity pointing away from the target, inside the regime where the
# acceleration-time quadratic of 1.3.1 had two positive roots:
#   v0 points away from pe  and  (v0^2 - ve^2) / (2 * dec_max) > |dp|
# 1.3.1 took the smaller root, which ends the acceleration phase still moving
# away, so the trajectory never reached pe. The *_backward_* cases above also
# start moving away, but outside this regime (|dp| is large against v0), where
# only one root is positive.
initial_velocity_away_tests:
  - name: test_away_reported_case
    description: "v0 away from the target, the reported case"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 3.0
      v0: -2.0
      ve: 0.0
    expected:
      case: 0
      total_time: 5.464
      v1: 1.732051
      p_min: -2.0
    notes: |
      Moving at -2 m/s while the target is 1 m ahead. The body stops after
      v0^2 / (2 * acc_max) = 2 m and comes back. Up to 1.3.1 the acceleration phase
      ended at v1 = -1.73 (still moving away) and the trajectory ran off to p = -5.

  - name: test_away_decel_stronger
    description: "v0 away from the target, dec_max > acc_max"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 2.0
      vmax: 4.0
      v0: -3.0
      ve: 0.0
    expected:
      case: 0
      total_time: 7.062
      v1: 2.708013
      p_min: -4.5

  - name: test_away_accel_stronger
    description: "v0 away from the target, acc_max > dec_max"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 2.0
      dec_max: 1.0
      vmax: 3.0
      v0: -2.0
      ve: 0.0
    expected:
      case: 0
      total_time: 3.449
      v1: 1.632993
      p_min: -1.0

  - name: test_away_vmax_reached
    description: "v0 away from the target, vmax reached on the way back"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 1.5
      v0: -2.0
      ve: 0.0
    expected:
      case: 1
      total_time: 5.5
      v1: 1.5
      p_min: -2.0
    notes: |
      In the regime too, but 1.3.1 got case 1 right: its vmax branch replaces v1
      with +vmax regardless of the root. Kept so both branches are covered.

  - name: test_away_above_vmax
    description: "v0 away from the target and above vmax"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 1.5
      v0: -4.0
      ve: 0.0
    expected:
      case: 1
      total_time: 11.5
      v1: 1.5
      p_min: -8.0

  - name: test_away_end_velocity
    description: "v0 away from the target, non-zero ve"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 3.0
      v0: -2.0
      ve: 0.5
    expected:
      case: 0
      total_time: 5.036
      v1: 1.767767
      p_min: -2.0

  - name: test_away_asymmetric_vmax_end_velocity
    description: "v0 away, dec_max > acc_max, vmax reached, non-zero ve"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 2.0
      vmax: 1.5
      v0: -3.0
      ve: 0.5
    expected:
      case: 1
      total_time: 7.583
      v1: 1.5
      p_min: -4.5

  - name: test_away_backward
    description: "v0 away from a target behind (negative direction)"
    params:
      p0: 0.0
      pe: -1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 3.0
      v0: 2.0
      ve: 0.0
    expected:
      case: 0
      total_time: 5.464
      v1: -1.732051
      p_max: 2.0

  - name: test_away_backward_vmax_end_velocity
    description: "v0 away from a target behind, vmax reached, non-zero ve"
    params:
      p0: 0.0
      pe: -1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 1.5
      v0: 2.0
      ve: -0.5
    expected:
      case: 1
      total_time: 5.083
      v1: -1.5
      p_max: 2.0

# End-velocity edge cases: ve pointing away from the target, and ve exactly the
# speed reached by accelerating over the whole distance.
end_velocity_tests:
  - name: test_end_velocity_away_overshoots
    description: "ve pointing away from the target: pass pe and come back"
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 1.0
      vmax: 3.0
      v0: 0.0
      ve: -0.5
    expected:
      case: 0
      total_time: 2.621
      v1: 1.06066
      p_max: 1.125
    notes: |
      The deceleration phase carries on through zero: the body passes pe, turns
      and arrives back at pe moving away at -0.5 m/s.

  - name: test_acceleration_only_arrival
    description: "ve exactly the speed reached by accelerating over the whole distance"
    params:
      p0: 0.0
      pe: 15.0
      acc_max: 0.3
      dec_max: 0.5
      vmax: 5.0
      v0: 0.0
      ve: 3.0
    expected:
      case: 0
      total_time: 10.0
      final_phase_duration: 0.0
    notes: |
      sqrt(2 * 0.3 * 15) = 3 in real arithmetic, but the computed peak is
      2.9999999999999996. A peak within rounding of ve is snapped onto it, so the
      deceleration phase has zero length instead of ve counting as unreachable.

  - name: test_acceleration_only_arrival_moving_away
    description: "Acceleration-only arrival starting away from the target"
    params:
      p0: 0.0
      pe: 15.0
      acc_max: 0.3
      dec_max: 0.5
      vmax: 5.0
      v0: -1.0
      ve: 3.1622776601683795
    expected:
      case: 0
      total_time: 13.874
      final_phase_duration: 0.0
      p_min: -1.667

  - name: test_acceleration_only_arrival_backward
    description: "Acceleration-only arrival in the negative direction"
    params:
      p0: 0.0
      pe: -15.0
      acc_max: 0.3
      dec_max: 0.5
      vmax: 5.0
      v0: 0.0
      ve: -3.0
    expected:
      case: 0
      total_time: 10.0
      final_phase_duration: 0.0

# Error condition tests
error_tests:
  - name: test_calc_trajectory_without_setup
    description: "Test calc_trajectory raises error when not properly initialized"
    test_type: "no_init"
    expected:
      error: ValueError
      error_contains: "End point not set"
    notes: |
      Tests that calling calc_trajectory() without proper initialization raises ValueError.
      This validates that the trajectory calculation requires proper setup first.

  - name: test_same_goal_resent_error
    description: "Same goal resent during motion (within 2%)"
    test_type: error
    params:
      p0: 0.6392
      pe: 0.79
      acc_max: 1.0
      vmax: 1.0
      dec_max: 1.0
      v0: 0.5492
      ve: 0.0
    expected:
      error: ValueError
      error_contains:
        - "Insufficient distance for trajectory planning"
        - "same goal is sent again"
        - "nearly equal to available distance"
    notes: |
      From real scenario: v0=0.5492 m/s, dp=0.1508 m requires ~0.15081 m to decel
      Difference is within 2% tolerance, triggering "same goal resent" error.

  - name: test_insufficient_distance_error
    description: "Insufficient distance (>2% away from deceleration distance)"
    test_type: error
    params:
      p0: 0.0
      pe: 0.5
      acc_max: 1.0
      vmax: 2.0
      dec_max: 1.0
      v0: 2.0
      ve: 0.0
    expected:
      error: ValueError
      error_contains:
        - "Insufficient distance to decelerate"
        - "Shortage:"
    notes: |
      decel_dist = v0^2 / (2 * dec) = 2.0^2 / (2 * 1.0) = 2.0m
      Available distance = 0.5m
      Shortage = (2.0 - 0.5) / 2.0 = 75% > 2%

  - name: test_general_constraint_error_overspeed_end
    description: "Start and end above vmax over too short a distance"
    test_type: error
    params:
      p0: 0.0
      pe: 0.5
      acc_max: 1.0
      vmax: 0.5
      dec_max: 1.0
      v0: 2.0
      ve: 2.0
    expected:
      error: ValueError
      error_contains_any:
        - "No valid trajectory found"
        - "Insufficient distance"
        - "constraints"
    notes: |
      Start above vmax and need to end above vmax, but distance is too short.
      This creates an impossible trajectory (vmax cannot be honoured).

  - name: test_general_constraint_error_cannot_stop_in_time
    description: "Error when trajectory calculation fails"
    test_type: error
    params:
      p0: 0.0
      pe: 0.1
      acc_max: 0.1
      vmax: 0.5
      dec_max: 0.1
      v0: 1.5
      ve: 0.0
    expected:
      error: ValueError
      error_contains_any:
        - "Insufficient distance"
        - "No valid trajectory"
        - "No positive time solution"
    notes: |
      High speed with tight constraints creates infeasible trajectory.

  - name: test_end_velocity_unreachable_from_rest
    description: "ve faster than any speed reachable within the distance"
    test_type: error
    params:
      p0: 0.0
      pe: 0.1
      acc_max: 1.0
      dec_max: 1.0
      vmax: 5.0
      v0: 0.0
      ve: 2.0
    expected:
      error: ValueError
      error_contains:
        - "End velocity unreachable without first moving away from the target"
        - "is 0.4472, but ve 2.0000"
    notes: |
      Accelerating over the whole 0.1 m reaches only sqrt(2 * 1 * 0.1) = 0.447 m/s.
      1.3.1 returned a trajectory that did not end at pe. Backing away first to gain
      run-up distance would reach ve; that reverse profile is not built (#9).

  - name: test_end_velocity_unreachable_moving_away
    description: "ve unreachable when starting away from the target"
    test_type: error
    params:
      p0: 0.0
      pe: 0.3
      acc_max: 0.5
      dec_max: 0.5
      vmax: 1.5
      v0: -0.5
      ve: 1.0
    expected:
      error: ValueError
      error_contains:
        - "End velocity unreachable"
        - "is 0.7416, but ve 1.0000"
    notes: |
      Highest reachable speed sqrt(v0^2 + 2 * acc_max * |dp|) = 0.742 m/s.

  - name: test_end_velocity_unreachable_peak_near_ve
    description: "Peak close to ve without being an acceleration-only arrival"
    test_type: error
    params:
      p0: 0.0
      pe: 1.0
      acc_max: 1.0
      dec_max: 1.0e-9
      vmax: 3.0
      v0: 0.0
      ve: 2.0
    expected:
      error: ValueError
      error_contains:
        - "End velocity unreachable"
        - "is 1.4142, but ve 2.0000"
    notes: |
      A tiny dec_max puts the computed peak at 1.9999999995, within rounding of
      ve, but accelerating from 0 to 2 at acc_max = 1 needs 2 m, not 1 m. The
      peak must only be snapped onto ve when the acceleration-only distance
      matches |dp|; otherwise the trajectory ended at p = 2 behind the clamp.

  - name: test_end_velocity_unreachable_small_scale
    description: "Unreachable ve at a very small scale"
    test_type: error
    params:
      p0: 0.0
      pe: 0.1
      acc_max: 1.0e-18
      dec_max: 1.0e-18
      vmax: 1.0e-8
      v0: 0.0
      ve: 1.0e-9
    expected:
      error: ValueError
      error_contains: "End velocity unreachable"
    notes: |
      The rounding tolerance is purely relative: an absolute floor would treat
      this peak as equal to ve, and the trajectory ended at p = 0.5.
