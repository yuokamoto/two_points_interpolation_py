name: Release

# Publishes to PyPI through Trusted Publishing (no API token): PyPI must list
# this repository, workflow file `release.yml` and environment `release` as a
# trusted publisher for the project.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version of an existing tag (e.g., 1.3.2)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Accept '1.3.2' or 'v1.3.2'
            INPUT="${{ inputs.version }}"
            INPUT="${INPUT#v}"
            TAG="v${INPUT}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not exist"
            exit 1
          fi
      - name: Check the tag matches the package version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          git checkout -q "${TAG}"
          PYPROJECT=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          MODULE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' two_point_interpolation/__init__.py)
          if [ "${PYPROJECT}" != "${VERSION}" ] || [ "${MODULE}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml (${PYPROJECT}) and __version__ (${MODULE})"
            exit 1
          fi
          echo "Validated release: ${TAG} (version ${VERSION})"

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    name: Build and Verify Package
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify package metadata
        run: twine check dist/*
      - name: Smoke-test the built wheel in a clean venv
        # The wheel alone, with no repository on the path: it must import with
        # the tagged version and build a trajectory that ends at its target.
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install "${wheels[0]}"
          cd /tmp && unset PYTHONPATH && /tmp/cleanenv/bin/python - <<'EOF'
          import two_point_interpolation as tpi
          assert tpi.__version__ == "${{ needs.validate.outputs.version }}", tpi.__version__
          t = tpi.TwoPointInterpolation()
          t.init(p0=0.0, pe=1.0, acc_max=1.0, vmax=10.0, v0=-2.0, ve=0.0, dec_max=1.0)
          t.calc_trajectory()
          p, v, _ = t.get_point(t.get_end_time() - 1e-9)
          assert abs(p - 1.0) < 1e-6 and abs(v) < 1e-6, (p, v)
          print("smoke test passed:", tpi.__version__)
          EOF
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [validate, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract changelog for this version
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # The section under "## [VERSION] - date", up to the next "## [" header
          awk -v v="${VERSION}" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^## \[/ {exit} found' docs/CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ needs.validate.outputs.tag }}" > release_notes.md
          fi
          cat release_notes.md
      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          generate_release_notes: false
